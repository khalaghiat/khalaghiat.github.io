<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغییر رمز — مجموعه مدارس خلاقیت اندیشه</title>
  <link rel="icon" href="static/img/favicon.png">
  <link rel="stylesheet" href="static/css/site.css">
</head>
<body><div style="background:#fcc814;color:#0f1547;text-align:center;padding:6px 12px;font-size:.85rem;font-weight:700">نسخه نمایشی — همه نام‌ها و اطلاعات ساختگی است. <a href="index.html" style="color:#0f1547">صفحه اصلی</a></div>
  <header class="topbar">
    <div class="wrap">
      <img src="static/img/logo.png" alt="لوگوی مدرسه">
      <div>
        <div class="name">مجموعه مدارس خلاقیت اندیشه</div>
        <div class="sub">سامانه دانش‌آموزی</div>
      </div>
      <div class="spacer"></div>
      
        <a class="toplink" href="password.html">تغییر رمز</a>
        <a class="toplink" href="index.html" style="color:#fcc814">خروج</a>
      
    </div>
  </header>
  <main class="wrap">
    
    
<div class="card login-box">
  <h1 style="font-size:1.2rem;color:var(--navy);margin:0">تغییر رمز عبور</h1>
  
  <form method="get" action="student-7.html">
    
      <label for="id_old_password">گذرواژهٔ قدیمی</label>
      <input type="password" name="old_password" autocomplete="current-password" autofocus required id="id_old_password">
      
    
      <label for="id_new_password1">گذرواژهٔ جدید</label>
      <input type="password" name="new_password1" autocomplete="new-password" required aria-describedby="id_new_password1_helptext" id="id_new_password1">
      
    
      <label for="id_new_password2">تأیید گذرواژهٔ جدید</label>
      <input type="password" name="new_password2" autocomplete="new-password" required aria-describedby="id_new_password2_helptext" id="id_new_password2">
      
    
    <p class="muted" style="text-align:right">رمز جدید حداقل ۶ کاراکتر باشد.</p>
    <button class="btn">ذخیره رمز جدید</button>
  </form>
</div>

  </main>
  <footer>مجموعه مدارس خلاقیت اندیشه — سنندج، خیابان استانداری، جنب گمرک — تلفن: ۳۳۱۶۶۹۴۹</footer>
</body>
</html>
